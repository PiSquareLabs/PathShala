<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathShala Merge Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/"><b>PathShala</b><span>School merge desk · Himachal Pradesh</span></a>
    <nav id="nav" aria-label="Sections">
      <a href="#/" data-v="home">Case map</a>
      <a href="#/cases" data-v="cases">Investigations</a>
      <a href="#/merges" data-v="merges">Merges</a>
      <a href="#/problems" data-v="problems">Problems <span class="badge red" id="b-p"></span></a>
      <a href="#/surveys" data-v="surveys">Surveys <span class="badge" id="b-q"></span></a>
      <a href="#/inbox" data-v="inbox">Feedback</a>
      <a href="#/rules" data-v="rules">Rules</a>
      <a href="#/sql" data-v="sql">SQLite</a>
    </nav>
    <div class="dbstat"><span id="dbstat"><span class="led"></span>Loading SQLite…</span><button class="btn sm" id="reset" title="Throw away changes and reload the demo data">Reset demo</button></div>
  </div>
</header>

<main id="app">
  <div class="loading" id="loading"><div><b>Starting SQLite in your browser…</b></div><div class="small">The whole app, including the rules engine, runs on this page.</div></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
