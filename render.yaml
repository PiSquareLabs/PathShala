services:
  - type: web
    name: pathshala-llm-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false   # you'll be prompted to paste it in the Render dashboard
      - key: APP_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
